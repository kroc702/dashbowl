<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Dashbowl</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="746b4fe2-d985-4d50-ab6b-f766019c41f4"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="nav-sticky">
    <div class="nav-container">
      <a href="{{ site.baseurl }}/{{page.langpath}}" class="nav-brand">DASH<img src="{{ site.baseurl }}/images/ball.png" alt="Dashbowl" class="nav-ball"><span>BOWL</span></a>
      <div class="nav-right">
        <ul class="nav-links">
        </ul>
          {% include lang-selector.html %}
      </div>
    </div>
  </nav>

  <!-- Subpage Header Banner -->
  <header class="page-header">
    <div class="page-header-overlay"></div>
    <div class="page-header-content">
      <h1 class="page-title">{{ page.title }}</h1>
      <p class="page-subtitle">
        {{ page.subtitle }}
      </p>
    </div>
  </header>

  <!-- Layout (Sidebar + Rules Content) -->
  <div class="layout-container">

    <!-- Sticky Table of Contents -->
    <aside class="sidebar">
      <div class="sidebar-title">{{site.data.i18n.rules[page.lang]}}</div>
      <ul class="toc-list">
        <li><a href="{{ site.baseurl }}/{{page.langpath}}rules">Règles de base</a></li>
        <li><a href="{{ site.baseurl }}/{{page.langpath}}experimental">Règles experimentales</a></li>
        <li><a href="{{ site.baseurl }}/{{page.langpath}}teams">Equipes</a></li>
        <li><a href="{{ site.baseurl }}/{{page.langpath}}download/">Download</a></li>
      </ul>
      <div class="sidebar-title">{{site.data.i18n.community[page.lang]}}</div>
      <ul class="toc-list">
        <li><a href="{{ site.discordurl }}">Discord</a></li>
        <li><a href="{{ site.baseurl }}/{{page.langpath}}objectives">Gouvernance</a></li>
      </ul>
    </aside>

    <main class="rules-content">
      <div class="rule-card">
        {{ content }}
      </div>
    </main>
  </div>

  {% include footer.html %}

</body>
</html>
