<!-- Sélecteur de Langue -->
<div class="lang-selector" id="lang-selector">
    <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false" aria-label="Change language / Changer de langue">
    <svg class="lang-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="lang-code" id="current-lang-code">{{ page.lang | upcase }}</span>
    <svg class="lang-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
    </button>
    <ul class="lang-dropdown" id="lang-dropdown" role="menu">
    <li role="none">
        <a href="{{ site.baseurl }}/fr/" class="lang-option {% if page.lang == 'fr' %}active{% endif %}" role="menuitem" data-lang="fr">
        <span class="lang-name">Français</span>
        </a>
    </li>
    <li role="none">
        <a href="{{ site.baseurl }}/" class="lang-option {% if page.lang == 'en' %}active{% endif %}" role="menuitem" data-lang="en">
        <span class="lang-name">English</span>
        </a>
    </li>
    </ul>
</div>

<script>
(function() {
  var langOptions = document.querySelectorAll('#lang-selector .lang-option');
  langOptions.forEach(function(option) {
    option.addEventListener('click', function() {
      var selectedLang = this.getAttribute('data-lang');
      if (selectedLang) {
        try {
          localStorage.setItem('dashbowl_lang', selectedLang);
        } catch (e) {
          console.warn('localStorage is not available:', e);
        }
      }
    });
  });
})();
</script>
